<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8">
		<meta name="color-scheme" content="dark light">
		<link rel="stylesheet" href="/common/common.css"/>
		<script src="/common/common.js"></script>
		<script src="config.js"></script>
		<script src="control.js"></script>
	</head>
	<body>
		<div id="header">
			<h3>%HOSTNAME%</h3>
			<h2>Control Config</h2>
		</div>
		<div id="settings">
			<label for="protocol">Protocol:</label>
			<select id="protocol">
				<option value="none">Disabled</option>
				<option value="sacn">sACN</option>
				<option value="artnet">ArtNet</option>
			</select>
			<label for="universe">Universe:</label>
			<input id="universe" type="number" min="0" max="65535" value="">
			<label for="address">Address:</label>
			<input id="address" type="number" min="0" max="512" value="">
			<label for="timeout">Timeout (ms) (0=never):</label>
			<input id="timeout" type="number" min="0" max="4294967295" value="">
		</div>
		<div class="save">
			<button id="saveButton" type="button">Save</button>
		</div>
		<div class="back">
			<a href="/config/index.html"><button type="button">Back</button></a>
		</div>
	</body>
</html>
