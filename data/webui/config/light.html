<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8">
		<meta name="color-scheme" content="dark light">
		<link rel="stylesheet" href="/common/common.css"/>
		<script src="/common/common.js"></script>
		<script src="config.js"></script>
		<script src="light.js"></script>
	</head>
	<body>
		<div id="header">
			<h3>%HOSTNAME%</h3>
			<h2>Light Config</h2>
		</div>
		<div id="settings">
			<div class="subform">
				<label for="module">Module</label>
				<select id="module" oninput="showModule(this.value)">
					<option value="none">None</option>
					<option value="pwm">PWM</option>
				</select>
				<div id="modulesettings" class="showone">
					<form id="modulenone" class="show">
					</form>
					<form id="modulepwm">
						<h3>GPIO:</h3>
						<label>Chan 0:<input name="gpio1" type="number" min="-1" max="40" value="-1"></label>
						<label>Chan 1:<input name="gpio2" type="number" min="-1" max="40" value="-1"></label>
						<label>Chan 2:<input name="gpio3" type="number" min="-1" max="40" value="-1"></label>
						<label>Chan 3:<input name="gpio4" type="number" min="-1" max="40" value="-1"></label>
						<label>Chan 4:<input name="gpio5" type="number" min="-1" max="40" value="-1"></label>
					</form>
				</div>
			</div>
			<h2>Channel Mapping:</h2>
			<form id="chanmap">
				<label>Red:<input name="0" type="number" min="-1" max="5" value="-1"></label>
				<label>Green:<input name="1" type="number" min="-1" max="5" value="-1"></label>
				<label>Blue:<input name="2" type="number" min="-1" max="5" value="-1"></label>
				<label>Cool:<input name="3" type="number" min="-1" max="5" value="-1"></label>
				<label>Warm:<input name="4" type="number" min="-1" max="5" value="-1"></label>
			</form>
		</div>
		<div class="save">
			<button id="saveButton" type="button">Save</button>
		</div>
		<div class="back">
			<a href="/config/index.html"><button type="button">Back</button></a>
		</div>
	</body>
</html>
