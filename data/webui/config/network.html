<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8">
		<meta name="color-scheme" content="dark light">
		<link rel="stylesheet" href="/common/common.css"/>
		<script src="/common/common.js"></script>
		<script src="config.js"></script>
	</head>
	<body>
		<div id="header">
			<h3>%HOSTNAME%</h3>
			<h2>Network Config</h2>
		</div>
		<div id="settings">
			<div id="wifi">

			</div>
			<div id="wifiAdd">

			</div>
			<hr/>
			<label for="hostname">Hostname:</label>
			<input id="hostname" type="text" pattern="[a-zA-Z0-9][\-a-zA-Z0-9]*[a-zA-Z0-9]" maxlength="63">
			<div>Also used for mDNS (hostname.local)</div>
			<hr/>
			<label for="apSSID">Access point SSID:</label>
			<input id="apSSID" type="text" value="%apSSID%" maxlength="32">
			<label for="apPass">Access point Password:</label>
			<input id="apPass" type="text" placeholder="(unchanged)" maxlength="63">
		</div>
		<div class="save">
			<button id="saveButton" type="button">Save</button>
		</div>
		<div class="back">
			<a href="/config/index.html"><button type="button">Back</button></a>
		</div>
	</body>
</html>
